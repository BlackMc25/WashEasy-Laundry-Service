{% extends "admin/base_admin.html" %}

{% block title %}
Create Reward Prize
{% endblock %}

{% block content %}

<div class="campaign-container">

    <div class="campaign-header">

        <div>

            <h2>✏ Edit Reward Prize</h2>

            <p>

            Update reward prize information.

            </p>

        </div>

        <a href="{% url 'admin_reward_prizes' %}"
           class="btn btn-secondary">

            ← Back

        </a>

    </div>

    <form method="POST"
          class="campaign-form">

        {% csrf_token %}

        <div class="form-section">

            <h4>

                Prize Information

            </h4>

            <hr>

        </div>

        <!-- Prize Name -->

        <div class="form-group">

            <label>

                Prize Name

            </label>

         <input
            type="text"
            name="name"
            value="{{ prize.name }}"
            required>

        </div>

        <!-- Campaign -->

        <div class="form-group">

            <label>

                Campaign

            </label>

            <select name="campaign">

            {% for campaign in campaigns %}

            <option
            value="{{ campaign.id }}"
            {% if campaign.id == prize.campaign.id %}
            selected
            {% endif %}>

            {{ campaign.title }}

            </option>

            {% endfor %}

            </select>

        </div>

        <!-- Policy -->

        <div class="form-group">

            <label>

                Reward Policy

            <select name="policy">

            <option value="">No Policy</option>

            {% for policy in policies %}

            <option
            value="{{ policy.id }}"
            {% if prize.policy and policy.id == prize.policy.id %}
            selected
            {% endif %}>

            {{ policy.name }}

            </option>

            {% endfor %}

            </select>

        </div>

        <!-- Prize Type -->

        <div class="form-group">

            <label>

                Prize Type

            </label>

            <select name="prize_type">

            {% for value,label in prize_types %}

            <option
            value="{{ value }}"
            {% if value == prize.prize_type %}
            selected
            {% endif %}>

            {{ label }}

            </option>

            {% endfor %}

            </select>

        </div>

        <!-- Two Columns -->

        <div class="form-row">

            <div class="form-group">

                <label>

                    Prize Value

                </label>

                <input
                    type="number"
                    name="value"
                    min="0"
                    value="0"
                    required>

            </div>

            <div class="form-group">

                <label>

                    Validity (Days)

                </label>

              <input
                type="number"
                name="validity_days"
                value="{{ prize.validity_days }}">

            </div>

        </div>

        <div class="form-row">

            <div class="form-group">

                <label>

                    Probability

                </label>

              <input
                type="number"
                name="probability"
                value="{{ prize.probability }}">

                <small>

                    Higher number means a greater chance of winning.

                </small>

            </div>

            <div class="form-group">

                <label>

                    Active

                </label>

                <div class="form-check mt-3">

                 <input
                    class="form-check-input"
                    type="checkbox"
                    name="is_active"
                    {% if prize.is_active %}
                    checked
                    {% endif %}>

                    <label class="form-check-label">

                        Prize Available

                    </label>

                </div>

            </div>

        </div>

        <div class="campaign-buttons">

            <button
                type="submit"
                class="btn btn-success">

                Update Prize

            </button>

            <a href="{% url 'admin_reward_prizes' %}"
               class="btn btn-secondary">

                Cancel

            </a>

        </div>

    </form>

</div>

{% endblock %}
