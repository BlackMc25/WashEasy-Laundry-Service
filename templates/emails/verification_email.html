<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Verify Your Email</title>

</head>

<body style="font-family:Arial,sans-serif;background:#f4f6f9;padding:40px;">

<div style="max-width:600px;margin:auto;background:white;border-radius:12px;padding:40px;">

<h2 style="color:#2563EB;">

👑 WashEasy

</h2>

<p>

Hello {{ user.first_name }},

</p>

<p>

Welcome to WashEasy!

</p>

<p>

Use the verification code below to activate your account.

</p>

<div style="text-align:center;margin:35px 0;">

<h1 style="letter-spacing:8px;color:#2563EB;">

{{ otp }}

</h1>

</div>

<p>

This code expires in <strong>{{ expiry_minutes }} minutes</strong>.

</p>

<div style="text-align:center;margin-top:35px;">

<a href="{{ verify_url }}"

style="background:#2563EB;color:white;padding:15px 30px;text-decoration:none;border-radius:8px;">

Verify My Account

</a>

</div>

<p style="margin-top:40px;color:#777;">

If you didn't create this account, simply ignore this email.

</p>

</div>

</body>

</html>
