<nav class="mobile-bottom-nav">

    <!-- Dashboard -->
    <a href="{% url 'dashboard' %}"
       class="mobile-nav-item {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">

        <div class="book-circle">
            <i class="fas fa-home"></i>
        </div>

        <span>Home</span>

    </a>

    <!-- Orders -->
    <a href="{% url 'my_orders' %}"
       class="mobile-nav-item {% if request.resolver_match.url_name == 'my_orders' %}active{% endif %}">

        <div class="book-circle">
            <i class="fas fa-box"></i>
        </div>

        <span>Orders</span>

    </a>

    <!-- Subscription -->
    <a href="{% url 'subscription' %}"
       class="mobile-nav-item {% if 'subscription' in request.path %}active{% endif %}">

        <div class="book-circle">

            <i class="fas fa-crown"></i>

            {% if active_subscription %}
                <span class="subscription-dot"></span>
            {% endif %}

        </div>

        <span>Subscription</span>

    </a>

    <!-- Notifications -->
    <a href="{% url 'notifications' %}"
       class="mobile-nav-item {% if request.resolver_match.url_name == 'notifications' %}active{% endif %}">

        <div class="book-circle">

            <i class="fas fa-bell"></i>

            {% if unread_notifications > 0 %}
                <span class="mobile-notification-badge">
                    {{ unread_notifications }}
                </span>
            {% endif %}

        </div>

        <span>Alerts</span>

    </a>

</nav>
